name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU-only torch
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install package
        run: pip install -e .

      - name: Package sanity (subpackages importable from installed wheel layout)
        run: |
          cd ..
          python -c "
          import hts_lib
          import hts_lib.models, hts_lib.data, hts_lib.training, hts_lib.evaluation
          import mgn, mgn.accel
          print('hts_lib', hts_lib.__version__)
          print('all subpackages import OK')
          "

      - name: Run unit tests
        run: python -m unittest discover tests -v

      - name: Run quickstart demo (CPU path)
        run: python quickstart_aml.py
