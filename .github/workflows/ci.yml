name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install "ruff>=0.5"
      - name: F (pyflakes) + E9 (syntax) — config in pyproject [tool.ruff]
        run: ruff check --output-format github .
      - name: Formatting advisory (ruff format) — non-blocking
        continue-on-error: true
        run: ruff format --check .

  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install torch (CPU build) and the package
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
      - name: Package sanity (import without CUDA extension)
        run: >
          python -c "import mgn, hts_lib;
          from mgn import ModelGenerator, ModelStructure, GeneratedModel;
          print('imports OK')"
      - name: Unit tests (CPU-safe, includes train() smoke + protocol tests)
        run: python -m unittest discover tests
      - name: Quickstart demo (exercises mgn + hts_lib end to end)
        run: python quickstart_aml.py
      - name: HtS quickstart (continual hypernetwork library)
        run: python quickstart_hts.py
      - name: CUDA kernel parity (runs only when the runner has a GPU)
        run: |
          python - <<'PY'
          import subprocess, sys, torch
          if not torch.cuda.is_available():
              print("No CUDA on this runner -> skipping validate_ext_in.py")
              raise SystemExit(0)
          raise SystemExit(subprocess.call([sys.executable, "validate_ext_in.py"]))
          PY
