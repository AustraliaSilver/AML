[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aml-framework"
version = "2.0.0"
description = "Architecture Mode Learning (AML) Framework: Meta-Generators (MGN) & Continual Hypernetworks (HtS)"
authors = [{ name = "AustraliaSilver" }]
readme = "README.md"
# PEP 639 SPDX expression. `license-files` needs setuptools>=77, which the
# build-system requirement above pins; the legacy `license = { file = ... }`
# table is deprecated and stops building in Feb 2027.
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = [
    "continual-learning",
    "catastrophic-forgetting",
    "hypernetwork",
    "dynamic-networks",
    "neural-architecture-search",
    "meta-learning",
    "pytorch",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# NOTE: no `License ::` classifier on purpose -- PEP 639 forbids combining it
# with the SPDX `license` expression above.
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
# Only needed by experiments/benchmark_baselines.py
baselines = ["scikit-learn>=1.0"]
# Needed by the experiments/ and probes/ benchmark + plotting scripts.
experiments = [
    "matplotlib>=3.5",
    "scipy>=1.8",
    "scikit-learn>=1.0",
    "datasets>=2.14",
]
dev = ["ruff>=0.5", "pytest>=7.0", "build>=1.2", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/AustraliaSilver/AML"
Repository = "https://github.com/AustraliaSilver/AML"
Issues = "https://github.com/AustraliaSilver/AML/issues"

[project.scripts]
# Install smoke test: proves a pip-installed wheel imports and runs a
# forward/backward pass without downloading any dataset. See mgn/_selfcheck.py.
aml-selfcheck = "mgn._selfcheck:main"

[tool.setuptools]
# Keep the wheel pure Python. If this flips to true, a locally built
# mgn/accel/_C.cp312-win_amd64.pyd can ride into a `py3-none-any` wheel and
# every non-Windows install breaks with a bogus module error.
include-package-data = false

[tool.setuptools.packages.find]
include = ["mgn*", "hts_lib*"]
exclude = ["mgn.tests*", "mgn.csrc*", "tests*"]
# Namespace discovery would also "find" mgn/csrc (C++/CUDA sources, no .py) and
# ship an empty package directory; requiring a real __init__.py keeps the wheel
# to the two importable packages.
namespaces = false

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["venv", "build", "data", "experiments_archive", "aml_framework.egg-info", "contest"]

[tool.ruff.lint]
# F = pyflakes (undefined names, unused imports, dead refs -> real defects)
# E9 = syntax / evaluation errors. Formatting-heavy rules (E501...) and import
# sorting (I) are intentionally left off to avoid a repo-wide churn commit.
select = ["F", "E9"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ re-exports are "unused" in-file by design.
"__init__.py" = ["F401"]
# Dev-only benchmark/probe scripts deliberately capture return values for
# side effects (matplotlib drawing, CUDA timing) without reading them back.
"probes/*" = ["F841"]
"mgn/tests/*" = ["F841"]
"experiments/*" = ["F841"]

[tool.pytest.ini_options]
pythonpath = [".", "AML_Core_Code"]
testpaths = ["tests"]
